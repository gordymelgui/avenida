<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVDA – Armá tu Outfit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'Rip Regular';
    src: url('./rip-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
</style>
<style>
    :root {
    --purple: #8357C5;
    --purple-light: #9d7bd8;
    --purple-dark: #6e48a9;
    --cream: #F5F0E8;
    --dark: #1a1a1a;
    --border: #1a1a1a;
    --brutal-shadow: 6px 6px 0px var(--dark);
    --brutal-shadow-hover: 3px 3px 0px var(--dark);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--purple-light);
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center center;
    color: var(--dark);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: url('AP/cursor_mano_AP_32.png'), auto;
  }
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
    100% { transform: translateY(0px); }
  }

  a, button, .item-card, .action-btn {
    cursor: url('AP/cursor_mano_AP_32.png'), pointer !important;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 36px;
    border-bottom: 4px solid var(--dark);
    background: var(--purple);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 0 var(--dark);
  }
  .logo-text {
    font-family: 'Rip Regular', sans-serif;
    font-size: 3rem;
    color: #fff;
    text-shadow: 3px 3px 0 var(--dark);
    letter-spacing: 2px;
  }
  .logo-sub {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--dark);
    text-transform: uppercase;
    font-weight: 900;
    margin-top: -8px;
    background: #fff;
    padding: 2px 6px;
    border: 2px solid var(--dark);
    border-radius: 4px;
    display: inline-block;
  }
  .header-tag {
    font-family: 'Press Start 2P', cursive;
    font-size: 0.6rem;
    color: #fff;
    text-transform: uppercase;
    background: var(--dark);
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 4px 4px 0 rgba(255,255,255,0.3);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* MAIN GRID */
  .stage {
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    min-height: calc(100vh - 65px);
  }

    /* SIDE PANELS */
  .panel {
    background: var(--cream);
    border-right: 4px solid var(--border);
    padding: 20px 14px;
    overflow-y: auto;
  }
  .panel.right { border-right: none; border-left: 4px solid var(--border); }
  .panel-title {
    font-family: 'Rip Regular', sans-serif;
    font-size: 1.5rem;
    color: var(--dark);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 4px solid var(--border);
  }

    /* ITEM CARDS */
  .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .item-card {
    background: #fff;
    border: 3px solid var(--border);
    border-radius: 8px;
    padding: 12px 6px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.1s ease;
    position: relative;
    user-select: none;
    box-shadow: var(--brutal-shadow);
  }
  .item-card:hover {
    background: var(--purple-light);
    transform: translate(2px, 2px);
    box-shadow: var(--brutal-shadow-hover);
  }
  .item-card.active {
    background: var(--purple);
    color: #fff;
    transform: translate(4px, 4px);
    box-shadow: 2px 2px 0px var(--dark);
  }
  .item-card.active::after {
    content: '★';
    position: absolute;
    top: -10px; right: -10px;
    font-size: 1.2rem;
    color: #ffd700;
    text-shadow: 2px 2px 0 var(--dark);
    animation: float 2s infinite;
  }
  .item-emoji {
    font-size: 2.4rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .item-card:hover .item-emoji { transform: scale(1.15) rotate(-10deg); }
  .item-card.active .item-emoji { transform: scale(1.1); }
  .item-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--dark);
    font-weight: 800;
    display: block;
    line-height: 1.3;
  }
  .item-card.active .item-label { color: #fff; }

  /* CENTER */
  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    gap: 16px;
  }
  .stage-hint {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.35em;
    color: #333;
    text-transform: uppercase;
  }

    /* CHARACTER CANVAS */
  .char-card {
    background: #fff;
    border: 4px solid var(--dark);
    border-radius: 16px;
    box-shadow: 12px 12px 0px rgba(0,0,0,0.2);
    padding: 24px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .char-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 10px,
      rgba(131,87,197,0.05) 10px,
      rgba(131,87,197,0.05) 20px
    );
    pointer-events: none;
  }

    .char-wrapper {
    position: relative;
    width: 100%;
    max-width: 280px;
    aspect-ratio: 280 / 420;
    z-index: 2;
  }
  .char-wrapper img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .char-wrapper img.clothing-layer {
    transition: opacity 0.2s ease;
  }
  .char-wrapper img.clothing-layer.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .char-wrapper img.sprite-layer {
    width: auto !important;
    height: auto !important;
    object-fit: none !important;
    z-index: 10 !important;
    top: auto; left: auto; bottom: auto; right: auto;
    pointer-events: none;
  }

  .char-badge {
    font-family: 'Press Start 2P', cursive;
    font-size: 0.5rem;
    color: var(--purple);
    margin-top: 15px;
    padding: 4px 8px;
    border: 2px solid var(--purple);
    border-radius: 4px;
    background: rgba(131,87,197,0.1);
  }

  /* ACTION BUTTONS */
  .action-btn {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: rgba(25,15,45,0.6);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .action-btn:hover {
    border-color: var(--purple-light);
    background: rgba(107,33,168,0.2);
    transform: translateX(3px);
  }
  .action-btn.primary {
    background: linear-gradient(135deg, var(--purple), var(--purple-dark));
    border-color: var(--purple-light);
  }
  .action-btn.primary:hover {
    background: linear-gradient(135deg, var(--purple-light), var(--purple));
    box-shadow: 0 0 20px rgba(168,85,247,0.35);
  }
  .action-btn.danger { border-color: #3a1010; }
  .action-btn.danger:hover { border-color: #ef4444; background: rgba(239,68,68,0.12); }
  .action-btn .ico { font-size: 1rem; }

  /* Outfit name */
  .field-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 5px;
    display: block;
  }
  .outfit-input {
    width: 100%;
    background: rgba(25,15,45,0.8);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .outfit-input:focus { border-color: var(--purple-light); }

  /* Selected list */
  .selected-list { margin-top: 14px; }
  .selected-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(107,33,168,0.08);
    border: 1px solid rgba(107,33,168,0.18);
    margin-bottom: 5px;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--purple-light);
    animation: fadeSlide 0.25s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(8px); }
    to   { opacity: 1; transform: none; }
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--purple-light); flex-shrink: 0; }
  .empty-note {
    text-align: center;
    padding: 24px 8px;
    color: #2a2a3a;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.6;
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: linear-gradient(135deg, var(--purple), var(--purple-dark));
    color: #fff;
    padding: 11px 26px;
    border-radius: 40px;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    z-index: 9999;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(107,33,168,0.45);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  #exportCanvas { display: none; }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 860px) {
    body { padding: 0; margin: 0; }
    
    header { 
      flex-direction: column; 
      align-items: flex-start; 
      gap: 10px; 
      padding: 10px 15px; 
    }
    .logo-text { font-size: 2rem; }
    .header-tag { align-self: flex-start; font-size: 0.55rem; padding: 6px 10px; }
    
    .stage { 
      display: flex; 
      flex-direction: column;
    }
    
    /* Center character goes to the top */
    .center { 
      order: -1; 
      padding: 15px 10px; 
      border-bottom: 3px solid var(--border); 
    }
    
    .panel { 
      border: none; 
      border-bottom: 3px solid var(--border); 
      padding: 15px 5px; 
    }
    .panel.right { 
      border-bottom: none; 
      padding: 15px; 
    }
    
    /* Horizontal scroll for items grid */
    .items-grid { 
      display: flex; 
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto; 
      gap: 12px; 
      padding-bottom: 15px;
      -webkit-overflow-scrolling: touch;
    }
    
    .item-card { 
      min-width: 90px;
      flex-shrink: 0;
      padding: 8px 4px;
    }
    .item-emoji { height: 50px !important; }
    .item-label { font-size: 0.55rem; }
    
    .char-card {
      padding: 15px 10px 10px;
      margin: 0 auto;
      width: 100%;
    }
  }
  #dev-helper button {
    background: var(--purple-light);
    border: none;
    color: white;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    margin-right: 5px;
    margin-top: 10px;
  }
  #dev-helper button:hover { background: white; color: var(--dark); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo-text">AVENIDA</div>
    <div class="logo-sub">Streetwear · Armá tu look</div>
  </div>
  <div class="header-tag">Outfit Builder — Beta</div>
</header>

<div class="stage">

  <!-- LEFT PANEL: ITEMS -->
  <div class="panel">
    <div class="panel-title">// Prendas</div>
    <div class="items-grid" id="itemsGrid"></div>
  </div>

  <!-- CENTER: CHARACTER -->
  <div class="center">
    <div class="stage-hint">↓ Click en las prendas para vestir a AP</div>

    <div class="char-card">
      <!--
        APPROACH: All images are absolute, same size (280x420).
        Base = original Ape (already styled with default clothes).
        Clothing layers are placed on top using object-fit + object-position
        to show only the relevant body region at the right proportion.

        Since we don't have transparent PNGs yet, each clothing image
        (item_shirt, item_pants, etc.) is rendered inside a clipping div
        that covers only the relevant section of the character frame.
        The character area uses a white background so white-bg images blend in.
      -->
      <div class="char-wrapper" id="charWrapper">

        <!-- BASE CHARACTER -->
        <img id="base-img"
             src="AP/APDEFAULT.png"
             onerror="this.src='AP/ape_full.jpg'; this.onerror=null;"
             alt="Ape">

        <!-- LAYER: SHOES (very bottom ~85-100%) -->
        <img id="layer-shoes" class="clothing-layer hidden"
             src="AP/layer_shoes.png"
             style="object-position: bottom; top: auto; bottom: 0; height: 22%;"
             alt="">

        <!-- LAYER: PANTS (lower body ~55-90%) -->
        <img id="layer-pants" class="clothing-layer hidden"
             src="AP/layer_pants.png"
             style="object-position: bottom; top: auto; bottom: 10%; height: 50%;"
             alt="">

        <!-- NEW LAYER: JORTS (Sprite based) -->
        <img id="layer-jortsiprite" class="clothing-layer sprite-layer hidden"
             src="AP/jortavdasprite.png"
             style="left: 2px; top: 78px; transform: scale(0.22); transform-origin: top left; position: absolute;"
             onerror="console.error('Error cargando jortavdasprite.png');"
             alt="">

        <!-- NEW LAYER: BAGGY SPRITE -->
        <img id="layer-baggysprite" class="clothing-layer sprite-layer hidden"
             src="AP/baggy sprite.png"
             style="left: -3px; top: 68px; transform: scale(0.23); transform-origin: top left; position: absolute;"
             onerror="console.error('Error cargando baggy sprite.png');"
             alt="">

        <!-- NEW LAYER: JORT DE VESTIR SPRITE -->
        <img id="layer-jortsvestirsprite" class="clothing-layer sprite-layer hidden"
             src="AP/jort capri sprite.png"
             style="left: -3px; top: 65px; transform: scale(0.23); transform-origin: top left; position: absolute;"
             onerror="console.error('Error cargando jort capri sprite.png');"
             alt="">

        <!-- LAYER: SHIRT (torso area ~30-65%) -->
        <img id="layer-shirt" class="clothing-layer hidden"
             src="AP/layer_shirt.png"
             style="object-position: center 38%; top: 28%; bottom: 35%; height: 42%;"
             alt="">

        <!-- LAYER: HOODIE (torso, slightly bigger than shirt) -->
        <img id="layer-hoodie" class="clothing-layer hidden"
             src="AP/layer_hoodie.png"
             style="object-position: center 38%; top: 25%; bottom: 30%; height: 48%;"
             alt="">

        <!-- NEW LAYER: CAMISA AVDA (Sprite based) -->
        <img id="layer-camisaavdasprite" class="clothing-layer sprite-layer hidden"
             src="AP/camisaavdasprite.png"
             style="left: 2px; top: 76px; transform: scale(0.22); transform-origin: top left; position: absolute;"
             onerror="console.error('Error cargando camisaavdasprite.png');"
             alt="">

        <!-- NEW LAYER: CAMISA LOGO FRONTAL SPRITE -->
        <img id="layer-camisalogosprite" class="clothing-layer sprite-layer hidden"
             src="AP/camisalogoavdasprite.png"
             style="left: 3px; top: 80px; transform: scale(0.22); transform-origin: top left; position: absolute;"
             onerror="console.error('Error cargando camisalogoavdasprite.png');"
             alt="">

        <!-- LAYER: CAP (top ~0-30% of frame) -->
        <img id="layer-cap" class="clothing-layer hidden"
             src="AP/layer_cap.png"
             style="object-position: top; object-fit: cover; height: 30%; top: 0; bottom: auto;"
             alt="">

      </div>
      <div class="char-badge">AP · AVENIDA Character</div>
    </div>
  </div>

  <!-- RIGHT PANEL: ACTIONS -->
  <div class="panel right">
    <div class="panel-title">// Tu Look</div>

    <label class="field-label">Nombre del outfit</label>
    <input class="outfit-input" id="outfitName" type="text" placeholder="Ej: Purple Season...">

    <button class="action-btn primary" onclick="exportOutfit()">
      <span class="ico">📥</span> Descargar outfit
    </button>
    <button class="action-btn" onclick="shareOutfit()">
      <span class="ico">🔗</span> Compartir look
    </button>
    <button class="action-btn danger" onclick="resetAll()">
      <span class="ico">↺</span> Resetear todo
    </button>

    <div class="panel-title" style="margin-top:18px">// Puesto</div>
    <div class="selected-list" id="selectedList">
      <div class="empty-note">Ninguna prenda<br>seleccionada aún</div>
    </div>
  </div>

</div>

<div id="dev-helper" style="display:none;">
  <b>DEBUG MODE</b><br>
  Arrastrá la prenda para moverla<br>
  Usa la ruedita para escalar<br><br>
  X: <span id="val-x">0</span><br>
  Y: <span id="val-y">0</span><br>
  Scale: <span id="val-s">1</span><br>
  <button onclick="changeScale(0.01)">+ Lento</button>
  <button onclick="changeScale(0.1)">+ Rápido</button><br>
  <button onclick="changeScale(-0.01)">- Lento</button>
  <button onclick="changeScale(-0.1)">- Rápido</button>
</div>
</div>

<canvas id="exportCanvas"></canvas>
<div id="toast">✓ Outfit guardado</div>

<script>
// ── ITEM DEFINITIONS ──────────────────────────────────
// pos: CSS overrides applied to the layer <img> for fine-tuning
const ITEMS = [
  {
    id: 'camisaavdasprite',
    label: 'Camisa AVDA',
    image: 'catalogo/camisas/cami A portada principal.png',
    emoji: '👕',
    layer: 'layer-camisaavdasprite',
    sprite: { x: 2, y: 76, scale: 0.22, z: 10 }
  },
  {
    id: 'jortsiprite',
    label: 'Jorts AVDA',
    image: 'catalogo/jorts/jort denim portada principal.png',
    emoji: '🩳',
    layer: 'layer-jortsiprite',
    sprite: { x: 2, y: 78, scale: 0.22, z: 10 }
  },
  {
    id: 'baggysprite',
    label: 'Baggy AVDA',
    image: 'catalogo/jeans holgados/portada baggy.png',
    emoji: '👖',
    layer: 'layer-baggysprite',
    sprite: { x: -3, y: 68, scale: 0.23, z: 10 }
  },
  {
    id: 'jortsvestirsprite',
    label: 'Jort Vestir AVDA',
    image: 'catalogo/jorts/vestir portada principal.png',
    emoji: '🩳',
    layer: 'layer-jortsvestirsprite',
    sprite: { x: -3, y: 65, scale: 0.23, z: 10 }
  },
  {
    id: 'camisalogosprite',
    label: 'Camisa Logo',
    image: 'catalogo/camisas/cami B portada principal.png',
    emoji: '👕',
    layer: 'layer-camisalogosprite',
    sprite: { x: 3, y: 80, scale: 0.22, z: 10 }
  },
  {
    id: 'cap',
    label: 'Snapback',
    image: 'AP/item_cap.png',
    emoji: '🧢',
    layer: 'layer-cap',
  },
  {
    id: 'shirt',
    label: 'Tee Blanca',
    emoji: '👕',
    layer: 'layer-shirt',
  },
  {
    id: 'hoodie',
    label: 'Hoodie Purple',
    emoji: '🧥',
    layer: 'layer-hoodie',
  },
  {
    id: 'pants',
    label: 'Cargo Pants',
    emoji: '👖',
    layer: 'layer-pants',
  },
  {
    id: 'shoes',
    label: 'Sneakers',
    emoji: '👟',
    layer: 'layer-shoes',
  },
];

const selected = new Set();
let activeSprite = null;

document.addEventListener('DOMContentLoaded', () => {
  console.log('AVDA Outfit Builder Initializing...');
  
  // ── BUILD CARDS ───────────────────────────────────────
  const grid = document.getElementById('itemsGrid');
  if (!grid) {
    console.error('Critical Error: itemsGrid not found!');
    return;
  }

  ITEMS.forEach(item => {
    const card = document.createElement('div');
    card.className = 'item-card';
    card.id = 'card-' + item.id;
    const emojiHtml = item.image ? `<img src="${item.image}" style="width: 100%; height: 100%; object-fit: contain;" alt="${item.label}">` : item.emoji;
    card.innerHTML = `
      <div class="item-emoji" style="height:64px; overflow:hidden;">${emojiHtml}</div>
      <span class="item-label">${item.label}</span>
    `;
    card.addEventListener('click', () => toggle(item));
    
    // DRAG AND DROP: dragstart
    card.draggable = true;
        card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', item.id);
      
      // Set the drag image to the actual clothing item image
      const img = card.querySelector('img');
      if (img) {
        // Create a temporary clone for a better "hanging" effect if desired, 
        // but passing the existing img directly is usually enough for the browser ghost.
        // We set the offset to the middle-top of the image so it looks like you are holding it by the hanger
        e.dataTransfer.setDragImage(img, img.width / 2, 10);
      }
    });
    grid.appendChild(card);
  });
  
  console.log('Items rendered:', ITEMS.length);
});

// ── TOGGLE ────────────────────────────────────────────
function toggle(item) {
  const card  = document.getElementById('card-' + item.id);
  const layer = document.getElementById(item.layer);

  if (selected.has(item.id)) {
    selected.delete(item.id);
    card.classList.remove('active');
    layer.classList.add('hidden');
    if (item.sprite) {
      activeSprite = null;
      document.getElementById('dev-helper').style.display = 'none';
    }
  } else {
    // mutual exclusion
    const toRemove = [];
    if (item.id === 'shirt' || item.id === 'hoodie' || item.id === 'camisaavdasprite' || item.id === 'camisalogosprite') {
      ['shirt', 'hoodie', 'camisaavdasprite', 'camisalogosprite'].forEach(id => {
        if (id !== item.id && selected.has(id)) toRemove.push(id);
      });
    }
    if (item.id === 'pants' || item.id === 'jortsiprite' || item.id === 'baggysprite' || item.id === 'jortsvestirsprite') {
      ['pants', 'jortsiprite', 'baggysprite', 'jortsvestirsprite'].forEach(id => {
        if (id !== item.id && selected.has(id)) toRemove.push(id);
      });
    }

    toRemove.forEach(otherId => {
      selected.delete(otherId);
      document.getElementById('card-' + otherId).classList.remove('active');
      document.getElementById(ITEMS.find(i => i.id === otherId).layer).classList.add('hidden');
    });

    selected.add(item.id);
    card.classList.add('active');
    layer.classList.remove('hidden');

    if (item.sprite) {
      activeSprite = item;
      document.getElementById('dev-helper').style.display = 'block';
      updateHelper();
    } else {
      activeSprite = null;
      document.getElementById('dev-helper').style.display = 'none';
    }
  }
  renderList();
}

// ── POSITIONING TOOL (DRAG & SCALE) ───────────────────
let isDragging = false;
const wrapper = document.getElementById('charWrapper');

// DRAG AND DROP: drop target
wrapper.addEventListener('dragover', (e) => {
  e.preventDefault();
});
wrapper.addEventListener('drop', (e) => {
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  const item = ITEMS.find(i => i.id === id);
  if (item && !selected.has(item.id)) {
    toggle(item);
  }
});

wrapper.addEventListener('mousedown', (e) => {
  if (activeSprite) {
    isDragging = true;
    e.preventDefault();
  }
});

window.addEventListener('mouseup', () => { isDragging = false; });

window.addEventListener('mousemove', (e) => {
  if (isDragging && activeSprite) {
    const rect = wrapper.getBoundingClientRect();
    const layer = document.getElementById(activeSprite.layer);
    
    // Calculate new position (relative to container)
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    activeSprite.sprite.x = Math.round(x);
    activeSprite.sprite.y = Math.round(y);
    
    layer.style.left = activeSprite.sprite.x + 'px';
    layer.style.top = activeSprite.sprite.y + 'px';
    updateHelper();
  }
});

function changeScale(delta) {
  if (!activeSprite) return;
  activeSprite.sprite.scale = Math.max(0.005, parseFloat((activeSprite.sprite.scale + delta).toFixed(3)));
  const layer = document.getElementById(activeSprite.layer);
  layer.style.transform = `scale(${activeSprite.sprite.scale})`;
  updateHelper();
}

wrapper.addEventListener('wheel', (e) => {
  if (activeSprite) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.01 : 0.01;
    changeScale(delta);
  }
}, { passive: false });

function updateHelper() {
  if (!activeSprite) return;
  document.getElementById('val-x').textContent = activeSprite.sprite.x;
  document.getElementById('val-y').textContent = activeSprite.sprite.y;
  document.getElementById('val-s').textContent = activeSprite.sprite.scale;
}

// ── SELECTED LIST ─────────────────────────────────────
function renderList() {
  const list = document.getElementById('selectedList');
  if (selected.size === 0) {
    list.innerHTML = '<div class="empty-note">Ninguna prenda<br>seleccionada aún</div>';
    return;
  }
  list.innerHTML = '';
  ITEMS.filter(i => selected.has(i.id)).forEach(item => {
    const el = document.createElement('div');
    el.className = 'selected-item';
    const imgHtml = item.image ? `<img src="${item.image}" style="width:16px;height:16px;object-fit:cover;border-radius:4px;">` : item.emoji;
    el.innerHTML = `<div class="dot"></div>${imgHtml} ${item.label}`;
    list.appendChild(el);
  });
}

// ── EXPORT ────────────────────────────────────────────
async function exportOutfit() {
  const W = 560, H = 840; // Exactly 2x the UI wrapper (280x420)
  const canvas = document.getElementById('exportCanvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // White background (matches the char-card)
  ctx.fillStyle = '#f8f6f0';
  ctx.fillRect(0, 0, W, H);

  // Draw base character (Fill the whole 2x frame)
  const baseEl = document.getElementById('base-img');
  await drawImg(ctx, baseEl.src, 0, 0, W, H);

  // Draw each active clothing layer
  const layerOrder = ['layer-pants', 'layer-jortsiprite', 'layer-baggysprite', 'layer-jortsvestirsprite', 'layer-shoes', 'layer-shirt', 'layer-hoodie', 'layer-camisaavdasprite', 'layer-camisalogosprite', 'layer-cap'];
  for (const layerId of layerOrder) {
    const el = document.getElementById(layerId);
    if (!el || el.classList.contains('hidden')) continue;

    const item = ITEMS.find(i => i.layer === layerId);
    if (item && item.sprite) {
      const cScale = 2; // W(560) / wrapper(280)
      await drawImg(ctx, el.src, 
        item.sprite.x * cScale, 
        item.sprite.y * cScale, 
        el.naturalWidth * item.sprite.scale * cScale, 
        el.naturalHeight * item.sprite.scale * cScale
      );
    } else {
      // Legacy percentage based positioning (assume it filled the whole wrapper)
      await drawImg(ctx, el.src, 0, 0, W, H);
    }
  }

  // AVDA branding strip
  ctx.fillStyle = '#0A0A0F';
  ctx.fillRect(0, H - 48, W, 48);

  ctx.font = 'bold 20px "Bebas Neue", sans-serif';
  ctx.fillStyle = 'rgba(168,85,247,0.9)';
  ctx.fillText('AVENIDA', 20, H - 18);

  const name = document.getElementById('outfitName').value || 'Mi Outfit';
  ctx.font = '12px "Space Grotesk", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(name.toUpperCase(), 20, H - 36);

  // Download
  const link = document.createElement('a');
  link.download = (name.replace(/\s+/g,'_') || 'outfit') + '_avda.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('¡Outfit descargado! 🔥');
}

function drawImg(ctx, src, x, y, w, h) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { ctx.drawImage(img, x, y, w, h); resolve(); };
    img.onerror = resolve;
    img.src = src + (src.includes('?') ? '&' : '?') + 't=' + Date.now();
  });
}

// ── SHARE ─────────────────────────────────────────────
function shareOutfit() {
  const pieces = ITEMS.filter(i => selected.has(i.id)).map(i => i.label).join(', ') || 'vacío';
  const text = `Mi outfit AVDA 🔥: ${pieces}`;
  if (navigator.share) {
    navigator.share({ title: 'AVDA Outfit', text });
  } else {
    navigator.clipboard.writeText(text).then(() => showToast('Look copiado ✓'));
  }
}

// ── RESET ─────────────────────────────────────────────
function resetAll() {
  selected.clear();
  ITEMS.forEach(item => {
    document.getElementById('card-' + item.id).classList.remove('active');
    document.getElementById(item.layer).classList.add('hidden');
  });
  document.getElementById('outfitName').value = '';
  renderList();
}

// ── TOAST ─────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
