<script>
    // === COUNTDOWN LÓGICA (HASTA MAÑANA A LA MEDIANOCHE) ===
    function updateCountdown() {
        const now = new Date();
        // Set to tomorrow at 23:59:59
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 23, 59, 59);
        const endDate = tomorrow.getTime();
        
        const update = () => {
            const currentTime = new Date().getTime();
            let distance = endDate - currentTime;
            
            if (distance < 0) return;
            
            // Calculate total hours remaining (includes days converted to hours)
            const totalHours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            const set = (id, val) => {
                const el = document.getElementById(id);
                if (!el) return;
                const str = val.toString().padStart(2, '0');
                if (el.innerText !== str) {
                    el.innerText = str;
                }
            };
            
            set('hours', totalHours); 
            set('minutes', minutes); 
            set('seconds', seconds);
        };
        
        setInterval(update, 1000);
        update();
    }
    
    updateCountdown();

    // === LÓGICA DE ACCESO (ADMIN) ===
    const SESSION_KEY = "avenida_unlocked_v4";
    
    // Auto bypass for admin via URL or session
    if (window.location.search.includes('admin=true')) {
        sessionStorage.setItem(SESSION_KEY, 'true');

                }
            });
        }
    }
</script><script>
    // === AVISAME LÓGICA ===
    const avisameBtn = document.getElementById('avisame-btn');
    const avisameEmail = document.getElementById('avisame-email');
    
    if (avisameBtn && avisameEmail) {
        avisameBtn.addEventListener('click', async () => {
            const email = avisameEmail.value.trim();
            if (!email || !email.includes('@')) {
                alert('Por favor, ingresa un correo válido.');
                return;
            }
            
            avisameBtn.disabled = true;
            const originalText = avisameBtn.innerText;
            avisameBtn.innerText = 'PROCESANDO...';
            
            try {
                // Ensure Firebase is initialized
                if (window.firebaseAuth && window.firebaseAuth.db) {
                    await window.firebaseAuth.db.collection('orders').add({
                        type: 'waitlist_email',
                        email: email,
                        source: 'Waitlist Drop 3',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else if (typeof firebase !== 'undefined') {
                    // Fallback if window.firebaseAuth is not fully set up on this page
                    await firebase.firestore().collection('orders').add({
                        type: 'waitlist_email',
                        email: email,
                        source: 'Waitlist Drop 3',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                avisameBtn.innerText = '¡REGISTRADO!';
                avisameBtn.classList.remove('bg-industrial-purple');
                avisameBtn.classList.add('bg-white', 'text-black');
                avisameEmail.value = '';
            } catch (error) {
                console.error("Error subscribing:", error);
                alert('Hubo un error. Intenta nuevamente.');
                avisameBtn.innerText = originalText;
                avisameBtn.disabled = false;
            }
        });
    }
